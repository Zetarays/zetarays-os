name: Bug report
description: Something does not work in ZETA RAYS OS
labels: [bug]
body:
  - type: dropdown
    id: image
    attributes:
      label: Image used
      options:
        - zetarays-2.1-amd64.iso
        - zetarays-2.1-arm64.iso
        - zetarays-2.1-amd64.ova
        - zetarays-2.1-arm64.ova
        - an older image (write which one in the description)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - Real computer (installed)
        - Real computer (live session from the USB stick)
        - VirtualBox
        - VMware
        - UTM / QEMU
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: Output of "sudo zeta-diagnostics"
      description: Open the terminal, run sudo zeta-diagnostics and paste the result here (it contains no passwords).
      render: text
  - type: markdown
    attributes:
      value: "Security problems: do not report them here, see SECURITY.md."
