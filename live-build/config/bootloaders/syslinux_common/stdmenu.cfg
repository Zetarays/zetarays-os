# ZETA RAYS — menu di avvio BIOS (isolinux), nello stesso stile del menu
# UEFI (GRUB): nero, marchio piccolo in alto (splash.png, generato da
# tools/gen-tema-grub.sh), voci in colonna, la scelta segnata da una fascia
# appena piu' chiara invece della barra blu a tutta larghezza.
# 1024x768 al posto dei 640x480 di serie: il font a punti di vesamenu
# (8x16) resta di misura normale e non enorme.
menu resolution 1024 768
menu background splash.png
# colonna larga 56 caratteri (448 px), centrata (128 colonne in tutto)
menu width 56
menu hshift 36
menu margin 0
# le voci cominciano alla riga 19 (y 304), sotto il marchio: vshift conta
# anche la riga del titolo e il bordo, che qui sono invisibili
menu vshift 16
menu rows 8
# queste righe si contano da vshift: 25 -> riga 41 dello schermo e cosi' via
menu helpmsgrow 15
menu cmdlinerow 25
menu timeoutrow 27
menu tabmsgrow 45
# colori: ARGB in primo piano e sfondo, nessuna ombra
menu color screen	37;40	#00000000 #00000000 none
menu color border	30;40	#00000000 #00000000 none
menu color title	1;37;40	#00000000 #00000000 none
menu color unsel	37;40	#ff8a8a8e #00000000 none
menu color hotkey	37;40	#ff8a8a8e #00000000 none
menu color sel		7;37;40	#ffffffff #ff1c1c21 none
menu color hotsel	7;37;40	#ffffffff #ff1c1c21 none
menu color disabled	37;40	#ff4a4a50 #00000000 none
menu color scrollbar	30;40	#00000000 #00000000 none
menu color tabmsg	37;40	#ff4a4a50 #00000000 none
menu color cmdmark	1;37;40	#ff3a8dff #00000000 none
menu color cmdline	37;40	#ffededea #00000000 none
menu color timeout_msg	37;40	#ff6e6e73 #00000000 none
menu color timeout	1;37;40	#ffededea #00000000 none
menu color help		37;40	#ff8a8a8e #00000000 none
menu autoboot Starting automatically in # s
# vesamenu scrive in CP437: niente frecce Unicode
menu tabmsg Enter: start    Tab: edit the entry
# Avvertenza visibile prima di scegliere: l'errore del kernel su una CPU a
# 32 bit e incomprensibile, e in VirtualBox capita a chi lascia il tipo di
# sistema su «Other/Unknown», che e a 32 bit.
menu notabmsg Requires a 64-bit processor. In VirtualBox: Type Linux, a 64-bit Version.
