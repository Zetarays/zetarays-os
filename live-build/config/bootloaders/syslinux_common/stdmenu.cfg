# ZETA RAYS — BIOS boot menu (isolinux), in the same style as the UEFI menu
# (GRUB): black, small logo at the top (splash.png, generated by
# tools/gen-grub-theme.sh), entries in a column, the selection marked by a
# slightly lighter band instead of the full-width blue bar.
# 1024x768 instead of the default 640x480: the vesamenu bitmap font (8x16)
# stays at a normal size instead of looking huge.
menu resolution 1024 768
menu background splash.png
# column 56 characters wide (448 px), centered (128 columns in total)
menu width 56
menu hshift 36
menu margin 0
# entries start at row 19 (y 304), below the logo: vshift also counts the
# title row and the border, which are invisible here
menu vshift 16
menu rows 8
# these rows are counted from vshift: 25 -> screen row 41, and so on
menu helpmsgrow 15
menu cmdlinerow 25
menu timeoutrow 27
menu tabmsgrow 45
# colors: ARGB foreground and background, no shadow
menu color screen	37;40	#00000000 #00000000 none
menu color border	30;40	#00000000 #00000000 none
menu color title	1;37;40	#00000000 #00000000 none
menu color unsel	37;40	#ff8a8a8e #00000000 none
menu color hotkey	37;40	#ff8a8a8e #00000000 none
menu color sel		7;37;40	#ffffffff #ff1c1c21 none
menu color hotsel	7;37;40	#ffffffff #ff1c1c21 none
menu color disabled	37;40	#ff4a4a50 #00000000 none
menu color scrollbar	30;40	#00000000 #00000000 none
menu color tabmsg	37;40	#ff4a4a50 #00000000 none
menu color cmdmark	1;37;40	#ff3a8dff #00000000 none
menu color cmdline	37;40	#ffededea #00000000 none
menu color timeout_msg	37;40	#ff6e6e73 #00000000 none
menu color timeout	1;37;40	#ffededea #00000000 none
menu color help		37;40	#ff8a8a8e #00000000 none
menu autoboot Starting automatically in # s
# vesamenu writes in CP437: no Unicode arrows
menu tabmsg Enter: start    Tab: edit the entry
# Warning shown before choosing: the kernel error on a 32-bit CPU is
# incomprehensible, and in VirtualBox it hits anyone who leaves the system
# type on «Other/Unknown», which is 32-bit.
menu notabmsg Requires a 64-bit processor. In VirtualBox: Type Linux, a 64-bit Version.
