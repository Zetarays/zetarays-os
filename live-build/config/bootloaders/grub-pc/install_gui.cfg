submenu 'Installazione grafica ...' --hotkey=g {

	source /boot/grub/theme.cfg

	menuentry 'Installa' --hotkey=i {
		linux	@KERNEL_GI@ vga=788 @APPEND_INSTALL@ --- quiet
		initrd	@INITRD_GI@
	}

	menuentry 'Installazione per esperti' --hotkey=x {
		linux	@KERNEL_GI@ priority=low vga=788 @APPEND_INSTALL@
		initrd	@INITRD_GI@
	}

	menuentry 'Installazione automatica' --hotkey=a {
		linux	@KERNEL_GI@ auto=true priority=critical vga=788 @APPEND_INSTALL@ --- quiet
		initrd	@INITRD_GI@
	}

	menuentry 'Modalità di ripristino' --hotkey=r {
		linux	@KERNEL_GI@ rescue/enable=true vga=788 @APPEND_INSTALL@ --- quiet
		initrd	@INITRD_GI@
	}
}

