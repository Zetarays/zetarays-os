set default=0
set timeout=5

# Font del terminale di GRUB. live-build lo mette in /boot/grub/unicode.pf2:
# «loadfont unicode» lo cerca invece in /boot/grub/fonts/ e falliva, e fino
# alla 2.0 si finiva sempre nel ramo «gfxmode=auto» (la risoluzione scelta
# qui sotto non veniva mai usata).
loadfont $prefix/unicode.pf2 || loadfont unicode

# Risoluzione del menu. Sui computer veri quella dello schermo (1920x1080 o
# la piu' vicina): con «auto» o 1280x800 il menu veniva stirato o
# ingrandito dallo schermo, con testo enorme e sfocato. Nelle macchine
# virtuali 1280x800: con i framebuffer semplici (VirtualBox QemuRamFB) il
# sistema eredita questa risoluzione e la finestra della VM resta comoda.
set gfxmode=1920x1080,1600x900,1366x768,1280x800,1280x720,1024x768,auto
# arm64: quasi sempre una VM (UTM, VirtualBox, Parallels), e VirtualBox su
# arm64 non ha SMBIOS: senza questo la VM nasceva a 1920x1080
if [ "$grub_cpu" = "arm64" ]; then
    set gfxmode=1280x800,1280x720,1024x768,auto
elif insmod smbios; then
    insmod regexp
    smbios --type 1 --get-string 4 --set zeta_marca
    smbios --type 1 --get-string 5 --set zeta_modello
    if regexp 'QEMU|VirtualBox|innotek|VMware|Parallels|Virtual Machine|KVM|Bochs|UTM|Xen' "$zeta_marca $zeta_modello"; then
        set gfxmode=1280x800,1280x720,1024x768,auto
    fi
fi
set gfxpayload=keep
insmod all_video

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
