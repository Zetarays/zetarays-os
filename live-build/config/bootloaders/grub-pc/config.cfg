set default=0
set timeout=5

# GRUB terminal font. live-build puts it in /boot/grub/unicode.pf2, while
# «loadfont unicode» looks for it in /boot/grub/fonts/ and failed: up to 2.0
# we always ended up in the «gfxmode=auto» branch (the resolution chosen
# below was never used).
loadfont $prefix/unicode.pf2 || loadfont unicode

# Menu resolution. On real computers, the screen's own (1920x1080 or the
# closest one): with «auto» or 1280x800 the screen stretched or scaled up
# the menu, with huge, blurry text. In virtual machines 1280x800: with
# simple framebuffers (VirtualBox QemuRamFB) the system inherits this
# resolution and the VM window stays a comfortable size.
set gfxmode=1920x1080,1600x900,1366x768,1280x800,1280x720,1024x768,auto
# arm64: almost always a VM (UTM, VirtualBox, Parallels), and VirtualBox on
# arm64 has no SMBIOS: without this the VM started at 1920x1080
if [ "$grub_cpu" = "arm64" ]; then
    set gfxmode=1280x800,1280x720,1024x768,auto
elif insmod smbios; then
    insmod regexp
    smbios --type 1 --get-string 4 --set zeta_vendor
    smbios --type 1 --get-string 5 --set zeta_model
    if regexp 'QEMU|VirtualBox|innotek|VMware|Parallels|Virtual Machine|KVM|Bochs|UTM|Xen' "$zeta_vendor $zeta_model"; then
        set gfxmode=1280x800,1280x720,1024x768,auto
    fi
fi
set gfxpayload=keep
insmod all_video

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
