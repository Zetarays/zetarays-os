source /boot/grub/config.cfg

# Menu della chiavetta in inglese (lingua universale); la lingua del
# sistema si sceglie poi nell'installer.

# Avvio del sistema live (prova senza installare)
menuentry "Try ZETA RAYS OS" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# Installazione di ZETA RAYS OS su questo computer
menuentry "Install ZETA RAYS OS" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ zeta-install
	initrd	@INITRD_LIVE@
}

# Avvio live in modalità sicura (compatibilità grafica)
menuentry "Try ZETA RAYS OS (safe graphics)" --hotkey=s {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Tools ...' --hotkey=o {

	source /boot/grub/theme.cfg

	# Memtest (se presente)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Impostazioni firmware (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI firmware settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verifica del supporto di avvio
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Check the boot media" --hotkey=c {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
