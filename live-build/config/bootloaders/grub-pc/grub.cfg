source /boot/grub/config.cfg

# The USB stick menu is in English (the universal language); the system
# language is chosen later in the installer.

# Boot the live system (try without installing)
menuentry "Try ZETA RAYS OS" --hotkey=t --class zeta-try {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# Install ZETA RAYS OS on this computer
menuentry "Install ZETA RAYS OS" --hotkey=i --class zeta-install {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ zeta-install
	initrd	@INITRD_LIVE@
}

# Live boot in safe mode (graphics compatibility)
menuentry "Try ZETA RAYS OS (safe graphics)" --hotkey=s --class zeta-safe {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Tools' --hotkey=o --class zeta-tools {

	source /boot/grub/theme.cfg

	# Memtest (if present)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware settings (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI firmware settings" --hotkey=f --class efi {
			fwsetup
		}
	fi

	# Boot media check
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Check the boot media" --hotkey=c --class zeta-check {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
