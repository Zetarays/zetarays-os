set color_normal=light-gray/black
set color_highlight=white/black

# Il tema c'e' sempre (lo sfondo di isolinux e' un PNG proprio, quindi
# live-build non crea piu' /boot/grub/splash.png: non va usato come segnale).
if [ -e /boot/grub/live-theme/theme.txt ]; then
    # font Roboto del tema (vedi live-theme/theme.txt)
    loadfont /boot/grub/live-theme/roboto-medium-13.pf2
    loadfont /boot/grub/live-theme/roboto-medium-16.pf2
    set theme=/boot/grub/live-theme/theme.txt
else
    set menu_color_normal=light-gray/black
    set menu_color_highlight=white/black
fi
