# ZETA RAYS — maintenance that must never steal the show.
#
# These jobs crawl the whole disk. With the default priority, on a computer
# with a slow disk, you can feel them: the desktop stutters, windows are slow
# to open, and the user thinks the system has frozen.
# They are not disabled here (they are needed, and security is part of
# ZETA RAYS): they are queued behind everything else. They use the disk only
# when nobody else is using it, and the CPU only when there is some to spare.
[Service]
Nice=19
IOSchedulingClass=idle
CPUSchedulingPolicy=idle
