# ZETA RAYS — aggiornamenti in sottofondo, mai davanti all'utente.
#
# Di serie girano a priorita piena: su un Mini PC si notano eccome. Qui
# scendono in fondo alla coda. La politica CPU resta quella normale: con
# «idle» un aggiornamento potrebbe non finire mai e lascerebbe occupato il
# lucchetto di dpkg, che poi fa fallire «apt install» all'utente.
[Service]
Nice=19
IOSchedulingClass=idle
