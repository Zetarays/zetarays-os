# ZETA RAYS — updates run in the background, never in the user's way.
#
# By default they run at full priority, which is very noticeable on a Mini
# PC. Here they drop to the back of the queue. The CPU policy stays normal:
# with «idle» an update might never finish and would keep the dpkg lock
# held, which then makes the user's «apt install» fail.
[Service]
Nice=19
IOSchedulingClass=idle
