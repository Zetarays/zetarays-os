# ZETA RAYS — la scansione non parte mai insieme a tutto il resto.
#
# Di serie parte a mezzanotte precisa e, con Persistent=yes, se il computer a
# quell'ora era spento si recupera al primo avvio: cioe' proprio mentre chi
# accende sta aprendo le sue cose. Insieme a lynis, all'indicizzazione del
# disco e agli aggiornamenti, sono cinque lavori pesanti in contemporanea.
# Un ritardo casuale fino a un'ora li sparpaglia.
[Timer]
RandomizedDelaySec=1h
