# ZETA RAYS — the scan never starts at the same time as everything else.
#
# By default it runs at exactly midnight and, with Persistent=yes, if the
# computer was off at that time it catches up at the next boot: that is, right
# when the person who just turned it on is opening their things. Together with
# lynis, disk indexing and updates, that makes five heavy jobs at once.
# A random delay of up to one hour spreads them out.
[Timer]
RandomizedDelaySec=1h
