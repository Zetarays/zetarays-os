# ZETA RAYS: a desktop starts on networks that hand out no address too (a
# cable with no DHCP server, a Wi-Fi that is not in range yet). There
# nm-online waited 60 seconds at boot and then left a failed unit. It now
# waits at most 30 seconds and a timeout is not an error: the network keeps
# connecting in the background, as on any desktop.
[Service]
Environment=NM_ONLINE_TIMEOUT=30
SuccessExitStatus=1
