# ZETA RAYS: the ClamAV signatures are updated by Debian's timer
# (clamav-freshclam-once.timer) through this unit, at the lowest priority.
# The always-running freshclam daemon is off (hook 0100): it kept 18 MB in
# memory and, started together with this unit at boot, both fought over
# /var/log/clamav/freshclam.log and this one failed. Not in the live session:
# there the 100 MB of signatures would be downloaded into RAM for nothing.
[Unit]
ConditionPathIsDirectory=!/run/live/medium

[Service]
Nice=19
IOSchedulingClass=idle
CPUSchedulingPolicy=idle
