# ZETA RAYS — manutenzione che non deve mai rubare la scena.
#
# Questi lavori frugano tutto il disco. Con la priorita di serie, su un
# computer con disco lento, si sentono: la scrivania scatta, le finestre
# tardano ad aprirsi, e chi lo usa pensa che il sistema si sia bloccato.
# Qui non vengono disattivati (servono, e la sicurezza e parte di ZETA RAYS):
# vengono messi in coda dietro a tutto il resto. Usano il disco solo quando
# nessun altro lo sta usando, e la CPU solo quando avanza.
[Service]
Nice=19
IOSchedulingClass=idle
CPUSchedulingPolicy=idle
