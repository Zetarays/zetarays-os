# ZETA RAYS: the first scan on a freshly installed system becomes the
# reference (log.expected), as chkrootkit-daily asks in DIFF_MODE. Without it
# every run reported the whole scan, including known false positives of
# Debian packages (firmware .placeholder files, NetworkManager listening on
# the network interface). Later runs report only what changed, in the journal.
[Service]
ExecStartPost=/bin/sh -c 'test -e /var/log/chkrootkit/log.expected || cp -a /var/log/chkrootkit/log.today /var/log/chkrootkit/log.expected'
