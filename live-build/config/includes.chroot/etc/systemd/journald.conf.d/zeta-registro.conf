# ZETA RAYS — un tetto al registro di sistema.
#
# Di serie il registro puo' crescere fino al 10% del disco (con un massimo di
# 4 GB). Su un Mini PC con un disco piccolo significa che, mese dopo mese, si
# mangia spazio e allunga ogni avvio: all'accensione systemd deve rileggere
# quel che c'e'. Duecento megabyte bastano per settimane di diagnosi vera, che
# e' a cosa serve un registro su una scrivania.
#
# Non si spegne e non si manda in RAM: cancellare i registri significa non
# poter piu' capire perche' qualcosa e' andato storto, ed e' esattamente cio'
# che serve quando il computer da' problemi.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=20M
RuntimeMaxUse=50M
