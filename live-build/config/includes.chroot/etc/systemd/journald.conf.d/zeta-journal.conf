# ZETA RAYS — a cap on the system journal.
#
# By default the journal can grow up to 10% of the disk (at most 4 GB). On a
# Mini PC with a small disk this means that, month after month, it eats space
# and slows down every boot: at startup systemd has to re-read what is there.
# Two hundred megabytes are enough for weeks of real diagnostics, which is
# what a journal on a desktop is for.
#
# It is neither turned off nor kept in RAM only: deleting the logs means no
# longer being able to understand why something went wrong, and that is
# exactly what is needed when the computer misbehaves.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=20M
RuntimeMaxUse=50M
