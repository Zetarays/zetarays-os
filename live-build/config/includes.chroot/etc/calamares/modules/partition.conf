---
# ZETA RAYS partitioning: EFI + ext4 system, proportional swap (max 8 GiB,
# never more than 10% of the disk) instead of "swap = RAM", which on small
# disks wasted space or was dropped altogether.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
# luks1: GRUB must be able to unlock the encrypted disk at boot
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
