---
# Partizionamento ZETA RAYS: EFI + sistema ext4, swap proporzionata (max 8 GiB,
# mai più del 10% del disco) invece di "swap = RAM" che sui dischi piccoli
# sprecava spazio o veniva scartata.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
# luks1: GRUB deve poter aprire il disco cifrato all'avvio
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
