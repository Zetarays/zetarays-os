# ZETA RAYS — ultimo controllo dell'installazione.
#
# Gira dentro il sistema appena installato. Se il programma di avvio non e'
# finito sul disco, esce con errore e Calamares segnala che l'installazione
# NON e' riuscita, invece di dire «All done» e lasciare un computer che non
# si avvia. Vedi /usr/local/libexec/zeta-verifica-avvio.
---
dontChroot: false
timeout: 120
script:
    - "/usr/local/libexec/zeta-verifica-avvio"
i18n:
    name: "Checking the boot loader"
    name[it]: "Controllo del programma di avvio"
