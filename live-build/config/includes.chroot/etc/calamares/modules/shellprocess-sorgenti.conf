# ZETA RAYS — sorgenti dei pacchetti uguali a quelle della sessione dal vivo
# (dopo «sources-final» di Debian, che toglie contrib e non-free).
# Vedi /usr/local/libexec/zeta-sorgenti-apt.
---
dontChroot: false
timeout: 60
script:
    - "/usr/local/libexec/zeta-sorgenti-apt"
i18n:
    name: "Package sources"
    name[it]: "Sorgenti dei pacchetti"
