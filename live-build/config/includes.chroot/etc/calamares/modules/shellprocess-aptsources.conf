# ZETA RAYS — make the package sources match those of the live session
# (runs after Debian's "sources-final", which drops contrib and non-free).
# See /usr/local/libexec/zeta-apt-sources.
---
dontChroot: false
timeout: 60
script:
    - "/usr/local/libexec/zeta-apt-sources"
i18n:
    name: "Package sources"
    name[it]: "Sorgenti dei pacchetti"
