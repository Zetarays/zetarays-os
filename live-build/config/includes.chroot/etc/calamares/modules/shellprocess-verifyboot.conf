# ZETA RAYS — final check of the installation.
#
# Runs inside the freshly installed system. If the boot loader did not make
# it onto the disk, it exits with an error and Calamares reports that the
# installation did NOT succeed, instead of saying «All done» and leaving a
# computer that does not boot. See /usr/local/libexec/zeta-verify-boot.
---
dontChroot: false
timeout: 120
script:
    - "/usr/local/libexec/zeta-verify-boot"
i18n:
    name: "Checking the boot loader"
    name[it]: "Controllo del programma di avvio"
