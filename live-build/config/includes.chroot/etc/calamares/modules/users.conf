---
# Utenti — configurazione di ZETA RAYS per l'installer.
userGroup:       users
# adm: legge i registri di sistema (non li modifica). Serve a zeta-diagnosi e
# al Monitor per mostrare errori e blocchi; e' come su Debian e Ubuntu per il
# primo utente, che ha gia' sudo.
defaultGroups:
    - adm
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

# La password la sceglie l'utente: anche brevi (es. "zeta") sono ammesse.
# libpwquality impone sempre almeno 6 caratteri, quindi qui non si usa.
passwordRequirements:
    minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "zetarays"
