---
# Users — ZETA RAYS configuration for the installer.
userGroup:       users
# adm: reads the system logs (does not modify them). Needed by zeta-diagnostics
# and the Monitor to show errors and hangs; same as on Debian and Ubuntu for
# the first user, who already has sudo.
defaultGroups:
    - adm
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

# The user chooses the password: short ones (e.g. "zeta") are allowed too.
# libpwquality always enforces at least 6 characters, so it is not used here.
passwordRequirements:
    minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "zetarays"
