# ZETA RAYS — come viene installato il programma di avvio (GRUB).
#
# ATTENZIONE, lezione pagata cara
# ------------------------------
# Questo file parte da quello di Debian e ne cambia UNA cosa sola. La prima
# versione conteneva solo le chiavi che sembravano servire, e mancava
# «efiBootLoader». Risultato: l'installazione arrivava in fondo dicendo
# «All done», ma nel registro c'era
#
#   WARNING: Configuration missing both efiBootLoader and efiBootLoaderVar
#            on an EFI system, bootloader not installed
#
# e il computer restava senza programma di avvio: partizioni giuste, sistema
# copiato, e niente che lo avviasse. Chi scrive qui dentro copi il file di
# Debian per intero e cambi solo cio' che deve cambiare.

---
# Quale programma di avvio installare su un sistema EFI. Senza questa riga il
# passo viene saltato in silenzio.
efiBootLoader: "grub"

# Il nome della cartella dentro la partizione EFI, cioe' /boot/efi/EFI/<nome>.
#
# Lasciandolo non impostato, Calamares lo ricava da «bootloaderEntryName» del
# branding, cioe' «ZETA RAYS»: uno spazio dentro un percorso di avvio, e un
# nome sanificato in modo non prevedibile. Soprattutto: due installazioni di
# ZETA RAYS sullo stesso computer finivano nella stessa cartella e la seconda
# sovrascriveva la prima, lasciando un GRUB che cercava i propri moduli su una
# partizione ormai riformattata (l'errore «normal.mod not found»).
#
# Qui e' scelto esplicitamente: minuscolo, senza spazi, come debian, ubuntu e
# kali. La cartella e' sempre /boot/efi/EFI/zetarays e non entra in conflitto
# con nessun altro sistema installato.
efiBootloaderId: "zetarays"

# Usate solo con systemd-boot; restano per non discostarsi da Debian.
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Copia GRUB anche come /boot/efi/EFI/BOOT/boot<arch>.efi, il percorso di
# ripiego che il firmware usa quando non trova una voce registrata. Su
# parecchi computer (portatili economici, mini PC, firmware che dimenticano le
# voci NVRAM dopo un aggiornamento) e' l'unico percorso che parte davvero.
installEFIFallback: true
