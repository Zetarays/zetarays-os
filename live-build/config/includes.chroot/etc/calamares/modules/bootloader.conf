# ZETA RAYS — how the boot loader (GRUB) is installed.
#
# WARNING, a lesson learned the hard way
# --------------------------------------
# This file starts from Debian's and changes ONE thing only. The first version
# contained only the keys that seemed necessary, and "efiBootLoader" was
# missing. Result: the installation went all the way to the end saying
# "All done", but the log contained
#
#   WARNING: Configuration missing both efiBootLoader and efiBootLoaderVar
#            on an EFI system, bootloader not installed
#
# and the computer was left without a boot loader: correct partitions, system
# copied, and nothing to boot it. Whoever edits this file: copy Debian's file
# in full and change only what has to change.

---
# Which boot loader to install on an EFI system. Without this line the step
# is silently skipped.
efiBootLoader: "grub"

# The name of the folder inside the EFI partition, i.e. /boot/efi/EFI/<name>.
#
# If left unset, Calamares derives it from the branding's "bootloaderEntryName",
# i.e. "ZETA RAYS": a space inside a boot path, and a name sanitized in an
# unpredictable way. Above all: two ZETA RAYS installations on the same
# computer ended up in the same folder and the second overwrote the first,
# leaving a GRUB that looked for its modules on a partition that had since
# been reformatted (the "normal.mod not found" error).
#
# Here it is set explicitly: lowercase, no spaces, like debian, ubuntu and
# kali. The folder is always /boot/efi/EFI/zetarays and doesn't clash with
# any other installed system.
efiBootloaderId: "zetarays"

# Used only with systemd-boot; kept so as not to diverge from Debian.
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Also copy GRUB as /boot/efi/EFI/BOOT/boot<arch>.efi, the fallback path the
# firmware uses when it finds no registered entry. On many computers (cheap
# laptops, mini PCs, firmware that forgets NVRAM entries after an update) it
# is the only path that actually boots.
installEFIFallback: true
