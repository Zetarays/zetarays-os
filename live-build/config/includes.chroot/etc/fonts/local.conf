<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ZETA RAYS — resa dei caratteri.
  Roboto (fornito da fonts-roboto-unhinted) è senza hinting: senza queste regole
  in una macchina virtuale a bassa densità il testo appare sfocato o irregolare.
  Qui si impostano antialiasing, hinting leggero e il filtro subpixel, così il
  testo è nitido ovunque. Roboto resta il sans predefinito, JetBrains Mono il
  monospazio; Noto copre i simboli che a Roboto mancano.
-->
<fontconfig>

  <!-- Famiglie predefinite -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Roboto</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>

  <!-- Resa: nitida a qualsiasi densità (anche nelle VM senza EDID) -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
  <match target="font">
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <!-- Autohinter attivo per i font senza hinting (Roboto) -->
  <match target="font">
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>

</fontconfig>
