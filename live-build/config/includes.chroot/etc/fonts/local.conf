<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ZETA RAYS — font rendering.
  Roboto (provided by fonts-roboto-unhinted) has no hinting: without these rules
  text looks blurry or uneven in a low-density virtual machine.
  This sets antialiasing, slight hinting and the subpixel filter, so text is
  sharp everywhere. Roboto stays the default sans, JetBrains Mono the
  monospace; Noto covers the symbols Roboto lacks.
-->
<fontconfig>

  <!-- Default families -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Roboto</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>

  <!-- Rendering: sharp at any density (even in VMs without EDID) -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
  <match target="font">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
  <match target="font">
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <!-- Autohinter enabled for fonts without hinting (Roboto) -->
  <match target="font">
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
  </match>

</fontconfig>
