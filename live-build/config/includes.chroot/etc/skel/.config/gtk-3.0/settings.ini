# ZETA RAYS — impostazioni GTK di partenza (poi rigenerate da zeta-accent).
# Il tema resta sempre "Adwaita": "Adwaita-dark" non esiste in GTK3 e la
# libreria ripiegherebbe sul tema chiaro. Il buio si sceglie qui sotto.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita
gtk-icon-theme-name=zeta
gtk-font-name=Roboto 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-decoration-layout=:
gtk-enable-animations=1
