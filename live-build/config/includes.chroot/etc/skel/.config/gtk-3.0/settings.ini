# ZETA RAYS — initial GTK settings (regenerated later by zeta-accent).
# The theme always stays "Adwaita": "Adwaita-dark" does not exist in GTK3 and
# the library would fall back to the light theme. Dark mode is chosen below.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita
gtk-icon-theme-name=zeta
gtk-font-name=Roboto 10
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-decoration-layout=:
gtk-enable-animations=1
