# ZETA RAYS — command history (atuin). Everything stays on this computer:
# no sync, no online update checks.
# Database: ~/.local/share/atuin/history.db (SQLite, survives a crash).
auto_sync = false
update_check = false
sync_frequency = "0"

# Ctrl+R: search by word (scattered letters work too); pressing Ctrl+R again
# while searching changes the scope: all, this session, this folder, this computer
search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
inline_height = 22
show_preview = true
show_help = true
# Enter puts the command on the line, to be edited before running it;
# Tab does the same. To run it right away: press Enter twice.
enter_accept = false
keymap_mode = "emacs"
store_failed = true

# Never in the history: passwords, tokens and keys (including in variables)
secrets_filter = true
history_filter = [
  "(?i)(password|passwd|pwd|token|secret|api[_-]?key)\\s*=\\s*\\S+",
  "(?i)^\\s*(export\\s+)?[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD|PASSWD)=",
  "sk-ant-", "sk-proj-", "ghp_", "gho_", "glpat-", "xox[baprs]-",
  "(?i)--(password|passwd|token|api-key|apikey)(=|\\s|$)",
  "(?i)mysql .*-p\\S+",
  "(?i)sshpass ",
]
