# ZETA RAYS — terminal (generated by zeta-accent from the template in
# /usr/share/zeta/terminal: changes made here are lost when the theme changes)
font=JetBrains Mono:size=10
pad=10x8
# Window tall enough to hold the ZETA RAYS logo (24 lines) plus the
# information: if it opened smaller, fastfetch could not show it.
initial-window-size-chars=126x34
term=xterm-256color
# the shell runs inside tmux (tabs, splits, sessions that survive closing
# the window): see zeta-terminal and /usr/share/zeta/shell
shell=zeta-terminal

[cursor]
style=block
color=0C0C0E 3A8DFF

[colors]
alpha=0.96
background=0C0C0E
foreground=EDEDEA
regular0=19191C
regular1=FF6B6B
regular2=4CC94A
regular3=FFB547
regular4=3A8DFF
regular5=C79BFF
regular6=5FD4E0
regular7=D6D6D2
bright0=6E6E73
bright1=FF8A8A
bright2=6FDC6D
bright3=FFC870
bright4=6AA8FF
bright5=D6B4FF
bright6=86E1EA
bright7=FFFFFF
selection-background=26262A
selection-foreground=FFFFFF

[key-bindings]
# copy/paste as in every Linux terminal: Ctrl+C stays the interrupt
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=none
spawn-terminal=none

[text-bindings]
# key combinations tmux cannot tell apart on its own: foot turns them into
# sequences tmux recognizes (user-keys in /usr/share/zeta/shell/tmux.conf)
\x1b[9990~=Control+Shift+t
\x1b[9991~=Control+Shift+w
\x1b[9992~=Control+Shift+d
\x1b[9993~=Control+Shift+e
\x1b[9994~=Control+Shift+n
\x1b[9995~=Control+Shift+r
\x1b[9996~=Control+Shift+f

# terminal theme chosen with «zeta shell theme»: empty until something is
# chosen (then the colors above apply, which follow the system theme)
[main]
include=~/.config/foot/theme.ini
