# ZETA RAYS — lock screen (hyprlock): solid black, time, user picture and
# password. No wallpaper and no logo: the locked screen (including in
# standby, on wake-up and on every monitor) is always black.
general {
    hide_cursor = false
    # screen copy via CPU: in virtual machines GPU buffers are rejected
    screencopy_mode = 1
}

background {
    monitor =
    # no image: hyprlock draws only the color, on every monitor
    color = rgb(000000)
}

label {
    monitor =
    # $TIME is hyprlock's internal clock: with "date" every second, two
    # processes per second were spawned while the screen was locked
    text = $TIME
    color = rgba(237, 237, 234, 1.0)
    font_size = 88
    font_family = Roboto Light
    position = 0, 270
    halign = center
    valign = center
}

label {
    monitor =
    # date in the user's language (it used to be forced to Italian)
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(138, 138, 142, 1.0)
    font_size = 16
    font_family = Roboto
    position = 0, 190
    halign = center
    valign = center
}

# the user's picture (round, ~/.face: Settings › Account); avatar, name and
# password centered below the time, even at 720 px of height
image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 0
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(237, 237, 234, 1.0)
    font_size = 15
    font_family = Roboto Medium
    position = 0, -55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    outer_color = rgba(255, 255, 255, 0.16)
    inner_color = rgba(18, 18, 20, 0.92)
    font_color = rgb(237, 237, 234)
    font_family = Roboto
    fade_on_empty = false
    placeholder_text = <span foreground="##8A8A8E">Password</span>
    # fail_text cannot be translated at runtime (fixed hyprlock text)
    fail_text = Wrong password
    check_color = rgba(255, 255, 255, 0.45)
    fail_color = rgba(255, 107, 107, 0.9)
    capslock_color = rgba(255, 181, 71, 0.9)
    rounding = 14
    position = 0, -115
    halign = center
    valign = center
}

label {
    monitor =
    # translated with gettext (zetarays domain); without gettext it stays in English
    text = cmd[update:0] gettext -d zetarays "Press Enter to unlock" 2>/dev/null || echo "Press Enter to unlock"
    color = rgba(110, 110, 115, 1.0)
    font_size = 11
    font_family = Roboto
    position = 0, -167
    halign = center
    valign = center
}
