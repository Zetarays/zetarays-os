# ZETA RAYS — schermata di blocco (hyprlock): nero, logo, ora e password.
general {
    hide_cursor = false
    # copia dello schermo via CPU: nelle macchine virtuali i buffer GPU vengono rifiutati
    screencopy_mode = 1
}

background {
    monitor =
    # collegamento allo sfondo attuale della scrivania, tenuto da zeta-sfondo
    path = ~/.config/zeta/sfondo-blocco
    color = rgb(000000)
}

label {
    monitor =
    # $TIME e' l'orologio interno di hyprlock: con «date» ogni secondo, a
    # schermo bloccato partivano due processi al secondo
    text = $TIME
    color = rgba(237, 237, 234, 1.0)
    font_size = 88
    font_family = Roboto Light
    position = 0, 270
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=it_IT.UTF-8 date +"%A %-d %B"
    color = rgba(138, 138, 142, 1.0)
    font_size = 16
    font_family = Roboto
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(237, 237, 234, 1.0)
    font_size = 15
    font_family = Roboto Medium
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    outer_color = rgba(58, 141, 255, 0.55)
    inner_color = rgba(18, 18, 20, 0.92)
    font_color = rgb(237, 237, 234)
    font_family = Roboto
    fade_on_empty = false
    placeholder_text = <span foreground="##8A8A8E">Password</span>
    fail_text = Password errata
    check_color = rgba(58, 141, 255, 0.9)
    fail_color = rgba(255, 107, 107, 0.9)
    capslock_color = rgba(255, 181, 71, 0.9)
    rounding = 14
    position = 0, -210
    halign = center
    valign = center
}

label {
    monitor =
    text = Premi Invio per sbloccare
    color = rgba(110, 110, 115, 1.0)
    font_size = 11
    font_family = Roboto
    position = 0, -262
    halign = center
    valign = center
}
