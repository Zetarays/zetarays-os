# ZETA RAYS — blocco automatico dopo 10 minuti di inattività e prima della sospensione.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # la sospensione aspetta che il blocco sia davvero a schermo (nero):
    # al risveglio non si vede mai la scrivania, nemmeno un attimo
    inhibit_sleep = 3
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
