# ZETA RAYS — automatic lock after 10 minutes of inactivity and before suspend.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # suspend waits until the lock screen is really showing (black):
    # on wake-up the desktop is never visible, not even for an instant
    inhibit_sleep = 3
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
