# ZETA RAYS — memory behavior.
#
# The kernel defaults are designed for servers, where throughput matters and
# not how responsive a window is to a click. On a desktop, and especially on
# a small computer with a slow disk, different choices are needed. There are
# four of them here, each with its reason.

# 1. How eagerly the kernel moves pages to swap.
#    The default is 60, designed for on-disk swap. In ZETA RAYS swap is
#    zram, i.e. compressed memory: moving a page there costs very little,
#    much less than throwing away the disk cache and having to read it
#    again. With 100 the kernel stops protecting swap as if it were
#    expensive. We do not go higher because, if zram ever failed to start,
#    an extreme value would cause heavy writes to the real disk.
vm.swappiness = 100

# 2. How many pages to read at once when one is fetched back from swap.
#    By default 8 are read together: that makes sense on a disk, where the
#    cost is the seek. On zram each page is decompressed individually:
#    reading eight means decompressing seven for nothing. Zero = one at a time.
vm.page-cluster = 0

# 3. How quickly to drop cached file and directory names (dentries/inodes).
#    The default is 100. Lowering it keeps them longer: opening the file
#    manager or searching for a document goes back to costing zero reads.
vm.vfs_cache_pressure = 50

# 4. How much modified data may wait to be written back.
#    By default up to 20% of memory: on 8 GB that is 1.6 GB which sooner or
#    later must all be written at once, and while that happens the computer
#    stops responding. It is one of the reasons copying large files "freezes"
#    the machine. With limits in bytes the ceiling does not grow with RAM.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
