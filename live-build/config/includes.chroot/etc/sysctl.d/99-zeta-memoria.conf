# ZETA RAYS — comportamento della memoria.
#
# I valori di serie del kernel sono pensati per i server, dove conta quanto
# lavoro passa e non quanto e' pronta una finestra al clic. Su una scrivania,
# e soprattutto su un computer piccolo con disco lento, servono scelte
# diverse. Qui ce ne sono quattro, ognuna con il suo motivo.

# 1. Quanto volentieri il kernel sposta le pagine nello scambio.
#    Di serie e' 60, pensato per uno scambio su disco. In ZETA RAYS lo
#    scambio e' zram, cioe' memoria compressa: spostarci una pagina costa
#    pochissimo, molto meno che buttare via la cache del disco e doverla
#    rileggere. Con 100 il kernel smette di difendere lo scambio come se
#    fosse costoso. Non si sale oltre perche', se un giorno zram non
#    partisse, un valore estremo farebbe scrivere molto sul disco vero.
vm.swappiness = 100

# 2. Quante pagine leggere in blocco quando se ne recupera una dallo scambio.
#    Di serie ne legge 8 insieme: ha senso su un disco, dove il costo e'
#    arrivarci. Su zram ogni pagina si decomprime da sola: leggerne otto
#    significa decomprimerne sette per niente. Zero = una per volta.
vm.page-cluster = 0

# 3. Quanto in fretta buttare via i nomi di file e cartelle tenuti in cache.
#    Di serie e' 100. Abbassandolo il sistema li tiene piu' a lungo: aprire
#    il gestore file o cercare un documento torna a costare zero letture.
vm.vfs_cache_pressure = 50

# 4. Quanti dati modificati possono restare in attesa di essere scritti.
#    Di serie fino al 20% della memoria: su 8 GB sono 1,6 GB che prima o poi
#    vanno scritti tutti insieme, e mentre succede il computer non risponde.
#    E' uno dei motivi per cui una copia di file grossi "inchioda" la
#    macchina. Con limiti in byte il tetto non cresce con la memoria.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
