# ZETA RAYS — SSH server. Enabled by default on installed systems (password
# chosen in the installer), disabled in the live session and in the OVAs (the
# password "zeta" is public). Toggle it with: sudo zeta-ssh on|off
# Conservative values; everything else is Debian's (/etc/ssh/sshd_config).
# Listens on all interfaces (0.0.0.0:22 and [::]:22, Debian defaults): who can
# reach it is decided by the firewall (zeta-ssh: local network, or internet too).
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
PermitEmptyPasswords no
# a hung session (e.g. Wi-Fi dropped) closes on its own after ~3 minutes
ClientAliveInterval 60
ClientAliveCountMax 3
# Both passwords and keys are accepted. To allow keys only:
#   PasswordAuthentication no   (in a .conf file in this directory)
