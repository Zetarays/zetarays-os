# ZETA RAYS — server SSH. Acceso di serie sui sistemi installati (password
# scelta nell'installer), spento nella sessione dal vivo e nelle OVA (password
# «zeta» nota a tutti). Si accende/spegne con: sudo zeta-ssh attiva|disattiva
# Valori prudenti; il resto e' quello di Debian (/etc/ssh/sshd_config).
# Ascolta su tutte le schede (0.0.0.0:22 e [::]:22, valori di Debian): chi puo'
# arrivare lo decide il firewall (zeta-ssh: rete locale, o anche internet).
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
PermitEmptyPasswords no
# una sessione rimasta appesa (Wi-Fi caduto) si chiude da sola dopo ~3 minuti
ClientAliveInterval 60
ClientAliveCountMax 3
# Password e chiavi sono accettate entrambe. Per usare solo le chiavi:
#   PasswordAuthentication no   (in un file .conf in questa cartella)
