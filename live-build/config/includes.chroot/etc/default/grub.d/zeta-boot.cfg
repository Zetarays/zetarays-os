# ZETA RAYS — boot menu listing the other installed operating systems.
#
# Why this file exists
# --------------------
# Since 2021 GRUB no longer looks for the other systems installed on the
# computer by itself: GRUB_DISABLE_OS_PROBER defaults to "true". The program
# that finds them (os-prober) is installed in ZETA RAYS, but without this
# line it never runs. As a result, anyone installing ZETA RAYS next to Kali,
# another distribution or Windows ends up with a menu showing only ZETA
# RAYS, and the other system seems to have vanished. It has not vanished:
# it is still there, but nobody looked for it.
#
# The reason it is off by default is real: a hostile system on another
# partition could inject its own entry into the menu. On a personal
# computer, where the partitions were created by the user, that risk is not
# worth a menu that hides half the computer. Every distribution designed to
# live alongside other systems makes the same choice.
#
# This file lives in /etc/default/grub.d/ rather than in /etc/default/grub on
# purpose: that file belongs to the grub-common package, and rewriting it
# would trigger the "configuration file has changed" prompt on every
# upgrade. Files in grub.d are read afterwards, and nothing else touches
# them.
GRUB_DISABLE_OS_PROBER=false

# Five seconds to choose. With a single system the menu goes almost
# unnoticed; with two or more, it is the time needed to read it and press an
# arrow key without hurrying.
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu

# GRUB_SAVEDEFAULT is not used to remember the last choice: to work, GRUB
# must write to its own area on disk, and on btrfs or with /boot on LVM it
# cannot. The result would be an error message at every power-on. Five
# seconds of menu are worth more than that convenience.
