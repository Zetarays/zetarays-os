# ZETA RAYS — menu di avvio con gli altri sistemi operativi installati.
#
# Perche' questo file esiste
# --------------------------
# Dal 2021 GRUB non cerca piu' da solo gli altri sistemi installati sul
# computer: GRUB_DISABLE_OS_PROBER vale «true» in partenza. Il programma che
# li trova (os-prober) e' installato in ZETA RAYS, ma senza questa riga non
# viene mai eseguito. Risultato: chi installa ZETA RAYS accanto a Kali, a
# un'altra distribuzione o a Windows si ritrova un menu con il solo ZETA
# RAYS, e l'altro sistema sembra sparito. Non e' sparito: e' li', ma nessuno
# lo ha cercato.
#
# Il motivo per cui e' spento di serie e' reale: un sistema ostile su
# un'altra partizione potrebbe far comparire una voce sua nel menu. Su un
# computer personale, dove le partizioni le ha fatte chi lo usa, il rischio
# non vale un menu che nasconde meta' del computer. Tutte le distribuzioni
# pensate per stare accanto ad altri sistemi fanno questa stessa scelta.
#
# Questo file sta in /etc/default/grub.d/ e non dentro /etc/default/grub di
# proposito: quello appartiene al pacchetto grub-common, e riscriverlo
# farebbe comparire la domanda «il file di configurazione e' cambiato» a
# ogni aggiornamento. I file in grub.d vengono letti dopo, e nessuno li
# tocca.
GRUB_DISABLE_OS_PROBER=false

# Cinque secondi per scegliere. Quando c'e' un solo sistema il menu passa
# quasi inosservato; quando ce ne sono due o piu', e' il tempo che serve a
# leggere e premere una freccia senza fretta.
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu

# Non si usa GRUB_SAVEDEFAULT per ricordare l'ultima scelta: per funzionare
# GRUB deve scrivere nella propria area su disco, e su btrfs o con /boot su
# LVM non ci riesce. Il risultato sarebbe un messaggio d'errore a ogni
# accensione. Cinque secondi di menu valgono piu' di quella comodita'.
