# ZETA RAYS — tmux del terminale (lo carica zeta-terminale).
# Tasti (li manda foot, vedi foot.ini: tmux da solo non distingue Ctrl+Maiusc):
#   Ctrl+Maiusc+T  nuova scheda        Ctrl+Maiusc+W  chiudi riquadro/scheda
#   Ctrl+Maiusc+D  dividi affiancato   Ctrl+Maiusc+E  dividi sopra/sotto
#   Ctrl+PagGiu'/PagSu'  scheda successiva/precedente
#   Alt+frecce     passa tra i riquadri
#   Ctrl+Maiusc+N  nuova scheda con un'altra shell (bash, zsh, fish…)
#   Ctrl+Maiusc+R  rinomina la scheda  Ctrl+Maiusc+F  cerca nel testo passato
# Ctrl+C resta l'interruzione del programma: copiare e' Ctrl+Maiusc+C.
# Testi in inglese: tmux.conf e' un file fisso e non si traduce a runtime.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot:RGB,xterm-256color:RGB"
set -g extended-keys on
set -s escape-time 10
set -g history-limit 20000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "ZETA RAYS Terminal — #{pane_title}"
set -g allow-rename on
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off

# chiudere la finestra con solo il prompt chiude la sessione; con un comando
# in corso la sessione resta e si riprende (zeta-terminale pulisci)
set-hook -g client-detached "run-shell -b \"zeta-terminale pulisci #{session_name}\""

# --- tasti: foot manda queste sequenze per le combinazioni con Ctrl+Maiusc ---
set -s user-keys[0] "\e[9990~"
set -s user-keys[1] "\e[9991~"
set -s user-keys[2] "\e[9992~"
set -s user-keys[3] "\e[9993~"
set -s user-keys[4] "\e[9994~"
set -s user-keys[5] "\e[9995~"
set -s user-keys[6] "\e[9996~"
bind -n User0 new-window -c "#{pane_current_path}"
bind -n User1 if -F "#{m/r:^-?(bash|zsh|fish|sh|dash|ksh|mksh|tcsh)$,#{pane_current_command}}" "kill-pane" "confirm-before -p \"#{pane_current_command} is running in this pane: close it? (y/n)\" -c y kill-pane"
bind -n User2 split-window -h -c "#{pane_current_path}"
bind -n User3 split-window -v -c "#{pane_current_path}"
bind -n User4 run-shell "zeta-terminale menu"
bind -n User5 command-prompt -I "#W" -p "Tab name:" "rename-window -- \"%%\""
bind -n User6 copy-mode \; command-prompt -p "Search:" "send -X search-backward \"%%\""
bind -n C-NPage next-window
bind -n C-PPage previous-window
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- copia e incolla -------------------------------------------------------
# Selezione col mouse: quando si rilascia il tasto il testo e gia negli
# appunti (wl-copy). Maiusc+trascina seleziona con foot, poi Ctrl+Maiusc+C.
# Incollare manda il testo «tra parentesi» (bracketed paste): piu righe
# incollate non partono da sole, si vedono e si confermano con Invio.
setw -g mode-keys emacs
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode C-c send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode Escape send -X cancel
bind -n MouseDown2Pane run-shell "wl-paste -n | tmux load-buffer -b zeta-clip - && tmux paste-buffer -p -d -b zeta-clip -t #{pane_id}"
bind -n MouseDown3Pane display-menu -O -T "#[align=centre] Terminal " -x M -y M \
  "Paste"                   v "run-shell \"wl-paste -n | tmux load-buffer -b zeta-clip - && tmux paste-buffer -p -d -b zeta-clip\"" \
  "Select and Copy"         c "copy-mode" \
  "" \
  "New Tab"                 t "new-window -c \"#{pane_current_path}\"" \
  "New Tab With…"           n "run-shell \"zeta-terminale menu\"" \
  "Split Side by Side"      d "split-window -h -c \"#{pane_current_path}\"" \
  "Split Top and Bottom"    e "split-window -v -c \"#{pane_current_path}\"" \
  "Rename Tab"              r "command-prompt -I \"#W\" -p \"Tab name:\" \"rename-window -- \\\"%%\\\"\"" \
  "" \
  "Close Pane"              w "kill-pane"

# --- aspetto: fondo nero, schede in alto, colore d accento di ZETA RAYS -----
# Colori di ripiego: quelli veri (accento e tema del terminale) li scrive
# zeta-terminale in ~/.cache/zeta/tmux-colori.conf, caricato qui sotto.
set -g status-position top
set -g status-justify left
set -g status-interval 0
set -g status-style "bg=#0C0C0E,fg=#8A8A8E"
set -g status-left ""
set -g status-right "#[fg=#8A8A8E]#{?client_prefix,PREFIX ,}#S "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#3A8DFF,fg=#FFFFFF,bold] #I #W #[default]"
set -g window-status-separator ""
set -g pane-border-style "fg=#26262A"
set -g pane-active-border-style "fg=#3A8DFF"
set -g message-style "bg=#19191C,fg=#EDEDEA"
set -g mode-style "bg=#26262A,fg=#FFFFFF"
set -g menu-style "bg=#141416,fg=#EDEDEA"
set -g menu-selected-style "bg=#3A8DFF,fg=#FFFFFF"
set -g menu-border-style "fg=#26262A"
set -g menu-border-lines rounded
# la barra delle schede compare solo quando ce ne sono almeno due
set -g status off
set-hook -g window-linked   "if -F \"#{>:#{session_windows},1}\" \"set status on\" \"set status off\""
set-hook -g window-unlinked "if -F \"#{>:#{session_windows},1}\" \"set status on\" \"set status off\""
source-file -q ~/.cache/zeta/tmux-colori.conf
# testi tradotti nella lingua dell'utente (li scrive zeta-terminale)
source-file -q ~/.cache/zeta/tmux-testi.conf
